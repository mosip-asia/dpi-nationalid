# Inji Certify Configuration for Agency A (DOPA National Identity Authority)
# ==============================================================================
# Environment: Thailand DPI Sandbox (Activity 1.5)
# Ingress: https://issuer.id.dpi.ait.ac.th

server.port=8080
spring.application.name=inji-certify-dopa

# Database Connection (Shared Identity Postgres)
spring.datasource.url=jdbc:postgresql://postgres.mosip.svc.cluster.local:5432/certify_dopa
spring.datasource.username=certify_user
spring.datasource.password=${CERTIFY_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# OID4VCI Issuer Configuration
certify.issuer.id=did:web:vdr.trust.dpi.ait.ac.th:issuers:dopa
certify.issuer.domain=issuer.id.dpi.ait.ac.th
certify.issuer.well-known-url=https://issuer.id.dpi.ait.ac.th/.well-known/openid-credential-issuer

# Cryptographic Signer (Cloud KMS / Software Ed25519)
certify.signer.key-type=Ed25519
certify.signer.key-id=did:web:vdr.trust.dpi.ait.ac.th:issuers:dopa#key-1
certify.signer.algorithm=Ed25519Signature2020

# MOSIP Foundational Identity Integration (eSignet & IDRepo)
mosip.esignet.base-url=https://login.id.dpi.ait.ac.th
mosip.esignet.userinfo-endpoint=https://login.id.dpi.ait.ac.th/v1/esignet/oauth/v2/userinfo
mosip.esignet.client-id=dopa-certify-client
mosip.esignet.client-secret=${ESIGNET_CLIENT_SECRET}

# Trust Framework Registration
trust.vdr.base-url=https://vdr.trust.dpi.ait.ac.th
trust.registry.base-url=https://registry.trust.dpi.ait.ac.th
trust.status-list.url=https://vdr.trust.dpi.ait.ac.th/status/status-list-2021.json

# Supported Credentials
certify.credentials.supported[0].id=ThaiNationalIDCredential
certify.credentials.supported[0].format=ldp_vc
certify.credentials.supported[0].types[0]=VerifiableCredential
certify.credentials.supported[0].types[1]=ThaiNationalIDCredential
certify.credentials.supported[0].schema-url=https://vdr.trust.dpi.ait.ac.th/schemas/thailand/national-id.jsonld
